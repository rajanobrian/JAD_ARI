function PicBadge({ id, xs }) {

      {id}

}

function SortTh({ col, children, sortState, onSort }) {
  const active = sortState.col === col;
  const arrow = !active || sortState.dir === 0 ? "⇅" : sortState.dir === 1 ? "↑" : "↓";
  return (
    <th
      onClick={() => onSort(col)}
      className={`text-left text-[9px] uppercase tracking-wider font-semibold px-2 py-2 cursor-pointer select-none whitespace-nowrap sticky top-0 bg-[#111827] border-b border-gray-800 ${active ? "text-blue-400" : "text-gray-500 hover:text-gray-300"}`}
    >
      {children} <span className={active ? "opacity-90" : "opacity-30"}>{arrow}</span>
    </th>
  );
}

/* ═══════════════════════ DASHBOARD ══════════════════════════════════════ */
function Dashboard() {
  const [sortState, setSortState] = useState({ col: null, dir: 0 });
  const [activeQuad, setActiveQuad] = useState(null);

  const total      = JOBS.length;
  const doneCount  = useMemo(() => JOBS.filter(j => j.st === "done").length, []);
  const onCount    = useMemo(() => JOBS.filter(j => j.st === "on").length, []);
  const q1Count    = useMemo(() => JOBS.filter(j => j.prio === "Q1").length, []);
  const soloCount  = useMemo(() => JOBS.filter(j => j.pics.length === 1).length, []);
  const collabCount= useMemo(() => JOBS.filter(j => j.pics.length > 1).length, []);

  const picStats = useMemo(() => {
    const s = {};
    PIC_IDS.forEach(id => { s[id] = { indv:0, col:0, wl:0 }; });
    JOBS.forEach(j => {
      if (j.pics.length === 1) { if (s[j.pics[0]]) s[j.pics[0]].indv++; }
      else { j.pics.forEach(id => { if (s[id]) s[id].col++; }); }
    });
    JOBS.filter(j => j.st !== "done").forEach(j => {
      const w = j.wl || 3;
      j.pics.forEach(id => { if (s[id]) s[id].wl += w; });
    });
    return s;
  }, []);

  const maxWL       = useMemo(() => Math.max(...PIC_IDS.map(id => picStats[id].wl)), [picStats]);
  const totalWL     = useMemo(() => JOBS.filter(j => j.st !== "done").reduce((s,j) => s + (j.wl||3), 0), []);
  const burnoutRate = useMemo(() => Math.round(totalWL / (25 * 4) * 100), [totalWL]);

  const matrix = useMemo(() => {
    const m = {};
    PIC_IDS.forEach(a => { m[a]={}; PIC_IDS.forEach(b => { m[a][b] = a===b ? null : 0; }); });
    JOBS.forEach(j => {
      if (j.pics.length < 2) return;
      for (let i=0; i<j.pics.length; i++)
        for (let k=i+1; k<j.pics.length; k++) {
          const a=j.pics[i], b=j.pics[k];
          if (m[a] && m[a][b]!==undefined) { m[a][b]++; m[b][a]++; }
        }
    });
    return m;
  }, []);

  const quadData = useMemo(() => {
    const out = {};
    ["Q1","Q2","Q3","Q4"].forEach(q => {
      const tasks = JOBS.filter(j => j.prio === q)
        .sort((a,b) => (a.st==="done"?1:0)-(b.st==="done"?1:0));
      const active = tasks.filter(j => j.st!=="done" && j.st!=="closed").length;
      out[q] = { tasks, active };
    });
    return out;
  }, []);

  const qCounts = useMemo(() => {
    const c = {Q1:0,Q2:0,Q3:0,Q4:0};
    JOBS.forEach(j => { const s=(j.st||"").toLowerCase(); if(s!=="done"&&s!=="closed"&&c[j.prio]!==undefined) c[j.prio]++; });
    return c;
  }, []);

  const sortedJobs = useMemo(() => {
    if (sortState.dir === 0) return JOBS;
    const PO = {Q1:1,Q2:2,Q3:3,Q4:4};
    const SO = {on:1,done:2,closed:3};
    return [...JOBS].sort((a,b) => {
      const d = sortState.dir;
      if (sortState.col==="cat")  return d*(a.cat||"").localeCompare(b.cat||"");
      if (sortState.col==="pic")  return d*(a.pics[0]||"").localeCompare(b.pics[0]||"");
      if (sortState.col==="prio") return d*((PO[a.prio]||9)-(PO[b.prio]||9));
      if (sortState.col==="stat") return d*((SO[(a.st||"").toLowerCase()]||9)-(SO[(b.st||"").toLowerCase()]||9));
      return 0;
    });
  }, [sortState]);

  function toggleSort(col) {
    setSortState(prev => {
      if (prev.col === col) {
        const nd = prev.dir===1 ? -1 : prev.dir===-1 ? 0 : 1;
        return { col: nd===0 ? null : col, dir: nd };
      }
      return { col, dir: 1 };
    });
  }

  function exportReport() {
    alert(
      "Job Assignment Dashboard — Unit ARI\n" +
      "Diekspor: " + new Date().toLocaleString("id-ID") + "\n\n" +
      "Total: " + total + "  |  Done: " + doneCount + "  |  On Progress: " + onCount + "\n" +
      "Q1 (Do Now): " + q1Count + "  |  Solo PIC: " + soloCount + "  |  Kolaborasi: " + collabCount
    );
  }

  function matCellCls(v) {
    if (v===null) return "bg-gray-800 text-gray-600";
    if (v===0)    return "bg-gray-900 text-gray-700";
    if (v<=2)     return "bg-blue-950 text-blue-400";
    if (v<=4)     return "bg-blue-900 text-blue-300";
    return "bg-blue-700 text-blue-100";
  }

  const burnIcon = burnoutRate<80 ? "✅" : burnoutRate<100 ? "⚠️" : "🔥";
  const burnCls  = burnoutRate<80 ? "text-emerald-400" : burnoutRate<100 ? "text-amber-400" : "text-red-400";

  /* ─── RENDER ──────────────────────────────────────────────────────────── */
  return (
    <div style={{ background:"#0f1117", height:"100vh", overflow:"hidden", display:"grid", gridTemplateColumns:"280px 1fr 480px", fontFamily:"ui-sans-serif,system-ui,sans-serif" }} className="text-gray-100 text-xs antialiased">

      {/* ══════════════ COL 1 — Left panel ══════════════ */}
      <div className="border-r border-gray-800 overflow-y-auto flex flex-col gap-2 p-3">

        {/* Brand */}
        <div className="flex items-start justify-between mb-0.5">
          <div>
            <div className="text-[9px] uppercase tracking-widest text-gray-600 font-semibold">Unit ARI · Analisa Risiko Bisnis</div>
            <div className="text-sm font-bold text-white mt-0.5 leading-tight">Job Assignment<br/>Dashboard</div>
          </div>
          <div className="text-right flex-shrink-0">
            <div className="text-[9px] font-bold text-gray-400">Q2–Q3 2026</div>
            <div className="flex items-center gap-1 justify-end mt-0.5">
              <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full" style={{ animation:"pulse 2s infinite" }}></span>
              <span className="text-[8px] text-emerald-500 font-bold">LIVE</span>
            </div>
          </div>
        </div>

        {/* KPI grid */}
        <div className="grid grid-cols-2 gap-1.5">
          {[
            { lbl:"Total Jobdesk", val:total,       sub:"Q2–Q3 2026",                              bar:"bg-blue-500" },
            { lbl:"Completed",     val:doneCount,   sub:Math.round(doneCount/total*100)+"% selesai", bar:"bg-emerald-500" },
            { lbl:"On Progress",   val:onCount,     sub:Math.round(onCount/total*100)+"% aktif",    bar:"bg-sky-400" },
            { lbl:"Q1 · Do Now",   val:q1Count,     sub:"Important · Urgent",                       bar:"bg-red-500" },
            { lbl:"Solo PIC",      val:soloCount,   sub:Math.round(soloCount/total*100)+"% indv",   bar:"bg-gray-500" },
            { lbl:"Kolaborasi",    val:collabCount, sub:Math.round(collabCount/total*100)+"% collab",bar:"bg-violet-500" },
          ].map(k => (
            <div key={k.lbl} className="bg-gray-900 rounded-lg p-2.5 border border-gray-800 relative overflow-hidden">
              <div className={`absolute left-0 top-0 bottom-0 w-0.5 ${k.bar}`}></div>
              <div className="text-[8px] text-gray-500 uppercase tracking-wide font-semibold pl-1 leading-tight">{k.lbl}</div>
              <div className="text-2xl font-bold tabular-nums mt-1 pl-1">{k.val}</div>
              <div className="text-[9px] text-gray-600 mt-0.5 pl-1">{k.sub}</div>
            </div>
          ))}
        </div>

        {/* PIC Assignment */}
        <div className="bg-gray-900 rounded-lg border border-gray-800">
          <div className="px-3 py-2 border-b border-gray-800 flex items-center justify-between">
            <div className="text-[10px] font-semibold text-gray-300 uppercase tracking-wider">Job Assignment per PIC</div>
            <span className="text-[9px] text-gray-600">Individu vs Kolaborasi</span>
          </div>
          <div className="p-2 grid grid-cols-2 gap-1.5 mb-1">
            <div className="bg-gray-800 rounded p-2">
              <div className="text-[8px] text-gray-500 uppercase tracking-wide">PIC Individu</div>
              <div className="text-lg font-bold mt-0.5">{soloCount}</div>
              <div className="text-[9px] text-gray-600">{Math.round(soloCount/total*100)}%</div>
            </div>
            <div className="bg-red-950/30 border border-red-900/30 rounded p-2">
              <div className="text-[8px] text-red-500 uppercase tracking-wide">Kolaborasi</div>
              <div className="text-lg font-bold text-red-400 mt-0.5">{collabCount}</div>
              <div className="text-[9px] text-red-600">{Math.round(collabCount/total*100)}%</div>
            </div>
          </div>
          <div className="px-2 pb-2 space-y-2">
            {PIC_IDS.map(id => {
              const s = picStats[id];
              const tot = s.indv + s.col;
              const indPct = tot>0 ? (s.indv/tot*100) : 0;
              const colPct = tot>0 ? (s.col/tot*100) : 0;
              const cfg = PIC_CFG[id];
              return (
                <div key={id} className="flex items-center gap-2">
                  <PicBadge id={id} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-baseline justify-between mb-0.5">
                      <span className="text-[10px] font-semibold text-gray-200">{id}</span>
                      <span className="text-[8px] text-gray-600">{tot} total</span>
                    </div>
                    <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden flex">
                      <div className="h-full rounded-l-full" style={{ width:`${indPct}%`, background:cfg.color }}></div>
                      <div className="h-full" style={{ width:`${colPct}%`, background:cfg.light, opacity:0.45 }}></div>
                    </div>
                    <div className="text-[8px] text-gray-600 mt-0.5">{s.indv} indv · {s.col} col</div>
                  </div>
                  <div className="flex gap-1.5 flex-shrink-0 text-center">
                    <div><div className="text-[10px] font-bold">{s.indv}</div><div className="text-[8px] text-gray-600">I</div></div>
                    <div><div className="text-[10px] font-bold">{s.col}</div><div className="text-[8px] text-gray-600">C</div></div>
                    <div><div className="text-[10px] font-bold text-red-400">{tot}</div><div className="text-[8px] text-gray-600">T</div></div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Collab Matrix */}
        <div className="bg-gray-900 rounded-lg border border-gray-800">
          <div className="px-3 py-2 border-b border-gray-800 flex items-center justify-between">
            <div className="text-[10px] font-semibold text-gray-300 uppercase tracking-wider">Collaboration Matrix</div>
            <span className="text-[9px] text-gray-600">Jumlah tugas bersama</span>
          </div>
          <div className="p-2">
            <div className="grid gap-0.5" style={{ gridTemplateColumns:`36px repeat(4,1fr)` }}>
              <div className="text-[8px] text-gray-700 flex items-center justify-center pb-0.5">↓\→</div>
              {PIC_IDS.map(id => (
                <div key={id} className="text-[9px] font-bold text-center text-gray-400 pb-0.5">{id}</div>
              ))}
              {PIC_IDS.map(row => (
                <React.Fragment key={row}>
                  <div className="text-[9px] font-bold text-gray-400 flex items-center">{row}</div>
                  {PIC_IDS.map(col => {
                    const v = matrix[row][col];
                    return (
                      <div key={row+col} className={`${matCellCls(v)} rounded text-[10px] font-bold text-center py-1.5 my-0.5`}>
                        {v===null ? "—" : v}
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>

        {/* Workload Analysis */}
        <div className="bg-gray-900 rounded-lg border border-gray-800">
          <div className="px-3 py-2 border-b border-gray-800 flex items-center justify-between">
            <div className="text-[10px] font-semibold text-gray-300 uppercase tracking-wider">Workload Analysis</div>
            <span className="text-[9px] text-gray-600">Beban aktif · threshold 25</span>
          </div>
          <div className="p-2">
            <div className={`flex items-center gap-2 p-2 rounded-lg mb-2 ${
              burnoutRate<80  ? "bg-emerald-950/30 border border-emerald-900/30" :
              burnoutRate<100 ? "bg-amber-950/30 border border-amber-900/30" :
                                "bg-red-950/30 border border-red-900/30"
            }`}>
              <span className="text-xl">{burnIcon}</span>
              <div>
                <div className={`text-lg font-bold tabular-nums ${burnCls}`}>{burnoutRate}%</div>
                <div className="text-[8px] text-gray-500">Burnout Rate · WL {totalWL} ÷ {25*4} kap</div>
              </div>
            </div>
            <div className="space-y-1.5">
              {PIC_IDS.slice().sort((a,b) => picStats[b].wl-picStats[a].wl).map(id => {
                const wl = picStats[id].wl;
                const pct = maxWL>0 ? Math.round(wl/maxWL*100) : 0;
                const warn = wl>25;
                const cfg = PIC_CFG[id];
                return (
                  <div key={id} className="flex items-center gap-2">
                    <PicBadge id={id} />
                    <div className="flex-1 h-2 bg-gray-800 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{ width:`${pct}%`, background:warn?"#ef4444":cfg.light }}></div>
                    </div>
                    <div className={`text-[10px] font-bold w-8 text-right tabular-nums ${warn?"text-red-400":"text-gray-400"}`}>
                      {wl}{warn && <span className="text-red-500">!</span>}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex flex-wrap gap-x-2 gap-y-0.5 mt-2 pt-2 border-t border-gray-800">
              {[1,2,3,4,5].map((v,i) => (
                <span key={v} className="text-[8px] text-gray-600">
                  <span className="font-semibold text-gray-500">{v}</span> {["Ringan","Sdg-Ringan","Sedang","Sdg-Berat","Berat"][i]}
                </span>
              ))}
            </div>
          </div>
        </div>

        <div className="text-[8px] text-gray-700 text-center pt-0.5 pb-1">
          Raja Nobriansyah [RNR] · Kepala Unit Analisis Risiko Bisnis
        </div>
      </div>

      {/* ══════════════ COL 2 — Eisenhower Matrix ══════════════ */}
      <div className="overflow-hidden flex flex-col p-3 gap-2" style={{ borderRight:"1px solid #1f2937" }}>

        {/* Header */}
        <div className="flex-shrink-0 flex items-start justify-between">
          <div>
            <div className="text-[9px] uppercase tracking-widest text-gray-600 font-semibold">Eisenhower Framework</div>
            <div className="text-sm font-bold text-white mt-0.5">Priority Matrix</div>
            <div className="text-[9px] text-gray-600 mt-0.5">Urgency × Importance</div>
          </div>
          <div className="flex gap-3 text-center">
            {["Q1","Q2","Q3","Q4"].map(q => (
              <div key={q}>
                <div className={`text-sm font-bold tabular-nums ${q==="Q1"?"text-red-400":q==="Q2"?"text-yellow-400":q==="Q3"?"text-orange-400":"text-gray-500"}`}>{qCounts[q]}</div>
                <div className="text-[8px] text-gray-600">{q}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Axis top */}
        <div className="flex-shrink-0 flex ml-5 gap-2 text-[8px] uppercase tracking-widest font-semibold">
          <div className="flex-1 text-center text-gray-400 border-b border-gray-700 pb-1">↑ Urgent</div>
          <div className="flex-1 text-center text-gray-600 border-b border-gray-800 pb-1">Not Urgent →</div>
        </div>

        {/* Y-axis + Grid */}
        <div className="flex flex-1 min-h-0 gap-1.5">
          <div className="flex-shrink-0 w-4 flex flex-col text-[7px] uppercase tracking-widest font-semibold">
            <div className="flex-1 flex items-center justify-center">
              <span className="text-gray-400" style={{ writingMode:"vertical-rl", transform:"rotate(180deg)" }}>← Important</span>
            </div>
            <div className="flex-1 flex items-center justify-center">
              <span className="text-gray-600" style={{ writingMode:"vertical-rl", transform:"rotate(180deg)" }}>Not Imp. →</span>
            </div>
          </div>

          {/* 2×2 quad grid */}
          <div className="flex-1 grid grid-cols-2 grid-rows-2 gap-2 min-h-0">
            {["Q1","Q2","Q3","Q4"].map(q => {
              const cfg = PRIO_CFG[q];
              const { tasks, active } = quadData[q];
              const isActive = activeQuad === q;
              return (
                <div key={q} className={`flex flex-col overflow-hidden rounded-xl border ${cfg.border} ${isActive?"ring-1 ring-blue-500/40":""}`}
                  style={{ background: cfg.bg }}>
                  {/* Quad header */}
                  <div className="flex-shrink-0 flex items-center justify-between px-2.5 py-1.5 cursor-pointer border-b"
                    style={{ background:cfg.head, borderColor:"inherit" }}
                    onClick={() => setActiveQuad(isActive ? null : q)}>
                    <div className="flex items-center gap-1.5">
                      <span className={`text-[8px] font-bold px-1.5 py-0.5 rounded ${cfg.badge}`}>{q}</span>
                      <span className="text-[10px] font-bold text-gray-200">{cfg.ql}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-[8px] text-gray-500">{cfg.sub.split("·")[0].trim()}</span>
                      <span className="text-sm font-bold text-gray-200 tabular-nums">{active}</span>
                    </div>
                  </div>
                  {/* Task list */}
                  <div className="flex-1 overflow-y-auto px-2 py-1.5">
                    {tasks.length === 0 ? (
                      <div className="h-full flex items-center justify-center text-gray-700 text-[9px]">∅ Tidak ada tugas</div>
                    ) : (
                      <ul className="space-y-1">
                        {tasks.map((j,idx) => (
                          <li key={j.no} className={`flex items-start gap-1.5 text-[10px] leading-snug ${j.st==="done"?"opacity-35":j.st==="closed"?"opacity-20 line-through":""}`}>
                            <span className="text-[8px] text-gray-700 font-mono mt-0.5 w-4 flex-shrink-0">{String(idx+1).padStart(2,"0")}</span>
                            <span className="text-gray-300 flex-1">{j.job}</span>
                            <span className="flex flex-wrap gap-0.5 flex-shrink-0 justify-end">
                              {j.pics.map(p => <PicBadge key={p} id={p} xs />)}
                            </span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Summary strip */}
        <div className="flex-shrink-0 bg-gray-900/60 border border-gray-800 rounded-lg px-3 py-2 flex items-center justify-between">
          <div className="flex gap-4 text-[9px]">
            <span><span className="font-bold text-red-400">{Math.round(qCounts.Q1/total*100)}% ({qCounts.Q1})</span> di Q1</span>
            <span><span className="font-bold text-yellow-400">{Math.round(qCounts.Q2/total*100)}% ({qCounts.Q2})</span> di Q2</span>
            <span><span className="font-bold text-orange-400">{Math.round(qCounts.Q3/total*100)}% ({qCounts.Q3})</span> di Q3</span>
          </div>
          <span className="text-[9px] text-gray-600">Distribusi sehat — mayoritas Important</span>
        </div>
      </div>

      {/* ══════════════ COL 3 — Table + KT ══════════════ */}
      <div className="flex flex-col overflow-hidden">

        {/* Table header */}
        <div className="flex-shrink-0 px-3 py-2.5 border-b border-gray-800 flex items-center justify-between" style={{ background:"#111827" }}>
          <div>
            <div className="text-[9px] uppercase tracking-widest text-gray-600 font-semibold">{total} items · Q2–Q3 2026</div>
            <div className="text-sm font-bold text-white mt-0.5">Completed List Jobdesk</div>
          </div>
          <button onClick={exportReport}
            className="flex items-center gap-1.5 px-2.5 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-[9px] text-gray-300 font-semibold cursor-pointer transition-colors">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2M8 2v8M5 7l3 3 3-3"/>
            </svg>
            Export
          </button>
        </div>

        {/* Scrollable table */}
        <div className="flex-1 overflow-auto">
          <table className="w-full border-collapse" style={{ tableLayout:"fixed" }}>
            <colgroup>
              <col style={{ width:"28px" }} />
              <col />
              <col style={{ width:"88px" }} />
              <col style={{ width:"56px" }} />
              <col style={{ width:"42px" }} />
              <col style={{ width:"52px" }} />
            </colgroup>
            <thead>
              <tr>
                <th className="text-left text-[9px] uppercase tracking-wider font-semibold px-2 py-2 whitespace-nowrap sticky top-0 bg-[#111827] border-b border-gray-800 text-gray-500">#</th>
                <th className="text-left text-[9px] uppercase tracking-wider font-semibold px-2 py-2 sticky top-0 bg-[#111827] border-b border-gray-800 text-gray-500">Jobdesk</th>
                <SortTh col="cat"  sortState={sortState} onSort={toggleSort}>Kategori</SortTh>
                <SortTh col="pic"  sortState={sortState} onSort={toggleSort}>PIC</SortTh>
                <SortTh col="prio" sortState={sortState} onSort={toggleSort}>Prio</SortTh>
                <SortTh col="stat" sortState={sortState} onSort={toggleSort}>Status</SortTh>
              </tr>
            </thead>
            <tbody>
              {sortedJobs.map(j => {
                const stl = (j.st||"").toLowerCase();
                const sc = STAT_CFG[stl] || STAT_CFG.on;
                const cc = CAT_CFG[j.cat] || "bg-gray-800 text-gray-400";
                const pc = PRIO_CFG[j.prio];
                return (
                  <tr key={j.no} className={`border-b border-gray-800/40 hover:bg-gray-800/30 transition-colors ${stl==="done"?"opacity-55":stl==="closed"?"opacity-30":""}`}>
                    <td className="px-2 py-1.5 text-[8px] text-gray-700 font-mono">{String(j.no).padStart(2,"0")}</td>
                    <td className="px-2 py-1.5 text-[10px] text-gray-200" style={{ overflow:"hidden" }}>
                      <div style={{ overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", lineHeight:"1.35" }}>{j.job}</div>
                    </td>
                    <td className="px-1.5 py-1.5">
                      <span className={`text-[7px] px-1 py-0.5 rounded font-semibold leading-none inline-block ${cc}`}
                        style={{ maxWidth:"100%", overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis" }}>{j.cat}</span>
                    </td>
                    <td className="px-1.5 py-1.5">
                      <div className="flex flex-wrap gap-0.5">
                        {j.pics.map(p => <PicBadge key={p} id={p} xs />)}
                      </div>
                    </td>
                    <td className="px-1.5 py-1.5 whitespace-nowrap">
                      <span className={`text-[7px] px-1 py-0.5 rounded font-semibold ${pc ? pc.badge : "bg-gray-800 text-gray-400"}`}>{j.pl}</span>
                    </td>
                    <td className="px-1.5 py-1.5 whitespace-nowrap">
                      <span className={`text-[7px] px-1 py-0.5 rounded font-semibold ${sc.cls}`}>{sc.label}</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Key Takeaways */}
        <div className="flex-shrink-0 border-t border-gray-800" style={{ maxHeight:"190px", display:"flex", flexDirection:"column" }}>
          <div className="flex-shrink-0 px-3 py-2 border-b border-gray-800 flex items-center gap-2" style={{ background:"#111827" }}>
            <span>🔥</span>
            <div className="text-[9px] font-semibold text-gray-300 uppercase tracking-wider">Job Desk Highlights</div>
          </div>
          <div className="overflow-y-auto flex-1 p-2">
            <ul className="space-y-1">
              {KEY_TAKEAWAYS.map((note,i) => (
                <li key={i} className="flex items-start gap-1.5 text-[10px] text-gray-400">
                  <span className="w-1 h-1 bg-red-500 rounded-full flex-shrink-0 mt-1.5"></span>
                  <span className="leading-snug">{note}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
</body>
</html>
